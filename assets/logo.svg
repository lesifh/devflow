<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200
  200">
    <defs>
      <linearGradient id="d1" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#3B82F6"/>
        <stop offset="1" stop-color="#1E40AF"/>
      </linearGradient>
    </defs>

    <!-- D 外轮廓（闭环） -->
    <path d="M70 46 V154 A62 62 0 0 1 70 46"
          fill="none" stroke="url(#d1)" stroke-width="16"          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 内部两条流动弧线（不闭合，暗示迭代） -->
    <path d="M70 64 C114 64 114 136 70 136"
          fill="none" stroke="url(#d1)" stroke-width="8" stroke-linecap="round"/>
    <path d="M70 82 C100 82 100 118 70 118"
          fill="none" stroke="url(#d1)" stroke-width="8" stroke-linecap="round"/>

    <!-- 流动节点 -->
    <circle cx="114" cy="56" r="8" fill="#3B82F6"/>
  </svg>